on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1,4'
    # scheduled at 08:00 every Monday and Thursday


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: "write"
    strategy:
      fail-fast: false
    steps:
      -
        name: "Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      -
        name: "Setup JDK"
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
      -
        name: "Clone ghidra"
        run: git clone https://github.com/nationalsecurityagency/ghidra 
      -
        name: "Pull deps"
        run: cd ghidra && ./gradlew -I gradle/support/fetchDependencies.gradle
      -
        name: "Apply patches"
        continue-on-error: true
        # - Patches that don't merge as of writing: 3903, 9556, 9127, 7308, 9522
        # - Patches removed due to build failures: 3331, 2727
        # - Breaks the decompiler reliably: 7502
        run: |
           cd ghidra
           for f in /home/runner/work/ghidra-staging/ghidra-staging/*.patch; do
             echo "APPLYING: $f"
             if [ "$(basename "$f")" = "3903-adds-getOriginalBytes-function-to-flat-API.patch" ]; then
               continue
             fi
             if [ "$(basename "$f")" = "9556-Add-data-type-conflict-resolution-option-to-Ver.patch" ]; then
               continue
             fi
             if [ "$(basename "$f")" = "9127-fix-stabilize-recursive-typedef-resolution-in-c.patch" ]; then
               continue
             fi
             if [ "$(basename "$f")" = "4103-WebAssembly-support.patch" ]; then
               continue
             fi
             if [ "$(basename "$f")" = "3331-Updates-to-assist-with-REing-16-bit-Windows-app.patch" ]; then
               continue
             fi
             if [ "$(basename "$f")" = "7308-PCode-Add-edge-label-information-to-XML-encodin.patch" ]; then
               continue
             fi
             if [ "$(basename "$f")" = "9522-9450-Add-cspec-driven-mechanism-for-fusing-spli.patch" ]; then
               continue
             fi
             if [ "$(basename "$f")" = "2727-Proper-C-Parser-GhidraClangPoweredParse.patch" ]; then
               continue
             fi

             if [ "$(basename "$f")" = "9574-Refuse-comments-at-unbacked-addressess.patch" ]; then
               continue
             fi

             if [ "$(basename "$f")" = "7502-Resolve-branches-injected-by-callfixups-and-oth.patch" ]; then
               continue
             fi

             patch -p1 --merge --no-backup-if-mismatch < "$f" || true
           done
      -
        name: "Build ghidra"
        run: cd ghidra && ./gradlew buildGhidra
      -
        name: "Remove zips"
        continue-on-error: true
        run: cd ghidra && rm build/dist/ghidra_*_DEV_*_*.zip
      -
        name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: Release
          path: "ghidra/build/dist/ghidra_*.zip"
          if-no-files-found: "error"
        if: ${{ !cancelled() }}   

  release:
    needs:
      - "build"
    runs-on: ubuntu-latest
    permissions:
      contents: "write"
    steps:
      -
        name: "Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      -
        name: "Download artifacts"
        uses: actions/download-artifact@v5
        with:
          path: "ext_out/"
          merge-multiple: true
      -
        name: "GitHub release"
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "ext_out/*"
          draft: false
          generateReleaseNotes: true
          makeLatest: true
          commit: master
          tag: "${{ github.run_id }}"
